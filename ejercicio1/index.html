<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convierte grados Celsius a Fahrenheit y Kelvin."
    />
    <title>Conversor de temperatura</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="converter">
      <header class="converter__header">
        <span class="converter__icon" aria-hidden="true">°</span>
        <p class="eyebrow">Herramienta de conversión</p>
        <h1>Conversor de temperatura</h1>
        <p class="intro">
          Ingresa una temperatura en grados Celsius y descubre su equivalencia.
        </p>
      </header>

      <form id="temperature-form" class="converter__form">
        <label for="celsius">Temperatura en Celsius</label>
        <div class="input-row">
          <input
            id="celsius"
            name="celsius"
            type="number"
            step="any"
            placeholder="Ej. 25"
            required
            autofocus
          />
          <span class="unit" aria-hidden="true">°C</span>
        </div>
        <button type="submit">Convertir temperatura</button>
      </form>

      <section
        id="results"
        class="results"
        aria-labelledby="results-title"
        aria-live="polite"
        hidden
      >
        <h2 id="results-title">Resultado</h2>
        <div class="result-grid">
          <article class="result-card">
            <span class="result-card__label">Fahrenheit</span>
            <output id="fahrenheit" class="result-card__value"></output>
            <span class="result-card__unit">°F</span>
          </article>
          <article class="result-card">
            <span class="result-card__label">Kelvin</span>
            <output id="kelvin" class="result-card__value"></output>
            <span class="result-card__unit">K</span>
          </article>
        </div>
      </section>

    </main>
  </body>
</html>
